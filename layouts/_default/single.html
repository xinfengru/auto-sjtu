{{ define "main" }}
<section class="iwin-page-banner iwin-article-banner"><div class="iwin-page-banner-inner"><span>{{ .Section | upper }}</span><h1>{{ .Title }}</h1></div></section>
<div class="iwin-inner-shell">
  {{ partial "iwin/sidebar.html" . }}
  <article class="iwin-inner-content iwin-article-content">
    <div class="iwin-breadcrumb"><a href="{{ site.Home.RelPermalink }}">首页</a><i class="fas fa-angle-right" aria-hidden="true"></i><a href="{{ printf "%s/" .Section | relURL }}">{{ .Section }}</a><i class="fas fa-angle-right" aria-hidden="true"></i><span>正文</span></div>
    {{ if not .Date.IsZero }}<time class="iwin-article-date" datetime="{{ .Date.Format "2006-01-02" }}">发布于 {{ .Date.Format "2006年01月02日" }}</time>{{ end }}
    <div class="article-style">{{ .Content }}</div>
  </article>
</div>
{{ end }}
