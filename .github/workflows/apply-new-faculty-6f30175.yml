name: Apply new faculty profiles

env:
  WC_HUGO_VERSION: '0.135.0'

on:
  push:
    paths:
      - .github/workflows/apply-new-faculty-6f30175.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply faculty profiles and official photos
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/faculty-profiles.tgz
          echo '1f5e9626e2029860e8521f19381eeb79c4ea0ea287151d20dd32d96d44171eb8  /tmp/faculty-profiles.tgz' | sha256sum -c -
          tar -xzf /tmp/faculty-profiles.tgz
          mkdir -p content/authors/{li-xianwei,zheng-yi,pan-lulu,shao-haibin,wang-jingcheng,fang-chongrong,ning-chao}
          curl -fsSL --retry 3 -A 'Mozilla/5.0' 'https://sais.sjtu.edu.cn/upload/jiaoshiml/%E6%9D%8E%E8%B4%A4%E4%BC%9F.jpg' -o content/authors/li-xianwei/avatar.jpg
          curl -fsSL --retry 3 -A 'Mozilla/5.0' 'https://sais.sjtu.edu.cn/upload/jiaoshiml/%E9%83%91%E6%AF%85.jpg' -o content/authors/zheng-yi/avatar.jpg
          curl -fsSL --retry 3 -A 'Mozilla/5.0' 'https://sais.sjtu.edu.cn/upload/jiaoshiml/%E6%BD%98%E9%B9%BF%E9%B9%BF.jpg' -o content/authors/pan-lulu/avatar.jpg
          curl -fsSL --retry 3 -A 'Mozilla/5.0' 'https://sais.sjtu.edu.cn/upload/image/20250815/20250815103856.jpg' -o content/authors/shao-haibin/avatar.jpg
          curl -fsSL --retry 3 -A 'Mozilla/5.0' 'https://sais.sjtu.edu.cn/upload/jiaoshiml/%E7%8E%8B%E6%99%AF%E6%88%90.jpg' -o content/authors/wang-jingcheng/avatar.jpg
          curl -fsSL --retry 3 -A 'Mozilla/5.0' 'https://sais.sjtu.edu.cn/upload/image/20251028/20251028112806.jpg' -o content/authors/fang-chongrong/avatar.jpg
          curl -fsSL --retry 3 -A 'Mozilla/5.0' 'https://sais.sjtu.edu.cn/upload/image/20250815/20250815140417.jpg' -o content/authors/ning-chao/avatar.jpg
          echo '89758ba486eca978645b0d75c2dd6b42b3737df1372f36dbb60d8be2f4d547a3  content/authors/li-xianwei/avatar.jpg' | sha256sum -c -
          echo '93873b98680ffa81a9f5c13ed2d3e0250d334e5046cae21e5b476472d9ee6a50  content/authors/zheng-yi/avatar.jpg' | sha256sum -c -
          echo '11dc3aff0b286f0a971d3fd923b16edebcc4239e7b41d3c6fdc209d2dc1faee9  content/authors/pan-lulu/avatar.jpg' | sha256sum -c -
          echo 'aa7d0bb3472262a33e6dc82b39f01a8f952b95eadb9ec5b294f5a8a8eec6664e  content/authors/shao-haibin/avatar.jpg' | sha256sum -c -
          echo '036ded82b71ec9fd311b341bacda8ca7b40c1152e8bfe6b019ec132624af4666  content/authors/wang-jingcheng/avatar.jpg' | sha256sum -c -
          echo '2c1e28db64f64097b721e90a53a81e2906329c5f9f9d29369385217a5ae79b03  content/authors/fang-chongrong/avatar.jpg' | sha256sum -c -
          echo '40e1871f0a2ea0f586922cd4cbfff26a0e70ec76e7b60df1efb12f81e4f0824d  content/authors/ning-chao/avatar.jpg' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/people/index.md content/authors/li-xianwei content/authors/zheng-yi content/authors/pan-lulu content/authors/shao-haibin content/authors/wang-jingcheng content/authors/fang-chongrong content/authors/ning-chao
          if ! git diff --cached --quiet; then
            git commit -m 'Add seven faculty profiles'
            git push
          fi
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
