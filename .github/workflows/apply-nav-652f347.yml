name: Apply primary navigation

env:
  WC_HUGO_VERSION: '0.135.0'

on:
  push:
    paths:
      - .github/workflows/apply-nav-652f347.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply navigation update
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/nav-update.tgz
          echo '006b90e18cff6a9e1befca676f4732a79d0d65e9ddbc39831cec727fa788a964  /tmp/nav-update.tgz' | sha256sum -c -
          tar -xzf /tmp/nav-update.tgz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/_default/menus.yaml config/_default/params.yaml content/tour/index.md content/post/_index.md content/people/index.md content/publication/_index.md content/student-training content/course-teaching content/culture content/recruitment
          if ! git diff --cached --quiet; then
            git commit -m 'Reorganize primary navigation'
            git push
          fi
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
