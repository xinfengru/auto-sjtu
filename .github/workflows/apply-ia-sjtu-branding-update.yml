name: Apply IA-SJTU branding update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply website update
        shell: bash
        run: |
          cat <<'PAYLOAD' | base64 -d > /tmp/ia-sjtu-branding-update.tgz
          
          PAYLOAD
          tar -xzf /tmp/ia-sjtu-branding-update.tgz -C .
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add IA-SJTU laboratory branding'
            git push origin HEAD:main
          fi
