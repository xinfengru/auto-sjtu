name: Apply faculty photos

on:
  push:
    paths:
      - '.github/workflows/apply-faculty-photos-412ace2.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apply-faculty-photos
  cancel-in-progress: false

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add official faculty photos
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -A 'Mozilla/5.0' 'https://english.seiee.sjtu.edu.cn/img/english/pic20111018/7712.jpg' -o content/authors/li-shaoyuan/avatar.jpg
          curl -fsSL --retry 3 -A 'Mozilla/5.0' 'https://sais.sjtu.edu.cn/upload/jiaoshiml/%E9%82%B9%E5%AA%9B%E5%AA%9B.jpg' -o content/authors/zou-yuanyuan/avatar.jpg
          curl -fsSL --retry 3 -A 'Mozilla/5.0' 'https://sais.sjtu.edu.cn/upload/image/20250811/20250811133518.jpg' -o content/authors/yin-xiang/avatar.jpg
          printf '%s  %s\n' \
            '0a27330238e87d5ca08b8e07eb75921fea11076ebc0f9346625bf80aedc1735c' 'content/authors/li-shaoyuan/avatar.jpg' \
            'e0b58ce8b14106d84365caa431343bb20692306386c11c94d8aa552ca37f70d6' 'content/authors/zou-yuanyuan/avatar.jpg' \
            'b48be29a0a94bd1a2d0844b33d3ca6f2f62c8413fdc44f5c3912459de0201476' 'content/authors/yin-xiang/avatar.jpg' | sha256sum --check --strict
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content/authors/li-shaoyuan/avatar.jpg content/authors/zou-yuanyuan/avatar.jpg content/authors/yin-xiang/avatar.jpg
          git commit -m 'Add official faculty profile photos'
          git push origin HEAD:main

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.135.0'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build website
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: apply-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
