name: Apply faculty ordering

on:
  push:
    paths:
      - '.github/workflows/apply-team-order-27e6562.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apply-faculty-ordering
  cancel-in-progress: false

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply team ordering files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d > /tmp/team-order-update.tgz <<'ARCHIVE'
          
          ARCHIVE
          echo '7333664372987e0ce9038c370ef1a375eb1e60efd6e305cd7e83c1e62cdf4e91  /tmp/team-order-update.tgz' | sha256sum --check --strict
          tar -xzf /tmp/team-order-update.tgz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- content/people/index.md content/authors/li-shaoyuan/_index.md content/authors/zou-yuanyuan/_index.md content/authors/yin-xiang/_index.md content/authors/bai-ting/_index.md
          git commit -m 'Group faculty by title and set display order'
          git push origin HEAD:main

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.135.0'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build website
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: apply-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
