name: Apply Chinese translation

on:
  push:
    paths:
      - '.github/workflows/apply-translation-548041c.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apply-chinese-translation
  cancel-in-progress: false

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply translated files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d > /tmp/translation-files.tgz <<'ARCHIVE'
          
          ARCHIVE
          echo 'af792a49d49853e4b4514acb7910efd8863a06e3ef0c00538f9301a84687ce92  /tmp/translation-files.tgz' | sha256sum --check --strict
          tar -xzf /tmp/translation-files.tgz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- config content i18n layouts
          git diff --cached --check
          git commit -m 'Translate site into Chinese'
          git push origin HEAD:main

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.135.0'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build website
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: apply-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
